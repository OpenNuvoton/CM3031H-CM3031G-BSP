project:
  packs:
    - pack: Nuvoton::NuMicroCM33_DFP
  setups:
    - setup: Options for emWin_CM3034_NuTFT
      processor:
        fpu: sp
      add-path:
        - ../../../../Library/CMSIS/Core/Include
        - ../../../../Library/Device/Nuvoton/cm3031/Include
        - ../../../../Library/StdDriver/inc
        - ../Config
        - ../Board
        - ../Application
        - ../ThirdParty/emWin_V656/GUI/Core
        - ../ThirdParty/emWin_V656/GUI/DisplayDriver
        - ../ThirdParty/emWin_V656/GUI/Widget
        - ../ThirdParty/emWin_V656/GUI/WM
        - ../ThirdParty/emWin_V656/GUI/MemDev
      debug: "on"
      define:
        - __DEMO_320x240__
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --map --datacompressor=off --info=inline --entry Reset_Handler
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: ../../../../Library/Device/Nuvoton/cm3031/Config/cm3031_ac6.sct
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/cm3031/Source/system_cm3031.c
        - file: ../../../../Library/Device/Nuvoton/cm3031/Source/startup_cm3031.c
    - group: User
      files:
        - file: ../main.c
        - file: ../Application/Demo_UI.c
        - file: ../Application/Boot_Screen.c
    - group: Library
      files:
        - file: ../../../../Library/StdDriver/src/clk.c
        - file: ../../../../Library/StdDriver/src/fmc.c
        - file: ../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../Library/StdDriver/src/sys.c
        - file: ../../../../Library/StdDriver/src/timer.c
        - file: ../../../../Library/StdDriver/src/uart.c
        - file: ../../../../Library/StdDriver/src/eadc.c
        - file: ../../../../Library/StdDriver/src/llsi.c
        - file: ../../../../Library/StdDriver/src/i2c.c
    - group: emWin_config
      files:
        - file: ../Config/GUI_X.c
        - file: ../Config/GUIConf.c
        - file: ../Config/LCDConf.c
    - group: emWin_lib
      files:
        - file: ../Lib/GUI_CM3034_AC6.lib
    - group: lcd
      files:
        - file: ../../../../Library/StdDriver/src/spi.c
        - file: ../../../../Library/StdDriver/src/gpio.c
        - file: ../Board/LCD_Port.c
        - file: ../Board/Touch_Port.c
        - file: ../Board/Keys_Port.c
        - file: ../Board/Joystick_Port.c
        - file: ../Board/ARGB_Port.c
